<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sermons & Resources</title><link rel="stylesheet" href="assets/css/styles.css"></head><body><div id="site-header"></div><div id="breadcrumb"></div><main class="section"><div class="container"><h1 class="section-title">Sermons & Resources</h1><div class="filters"><input id="searchSermon" placeholder="Search sermon title"><select id="topicFilter"><option value="">All topics</option><option>Discipleship</option><option>Doctrine</option><option>Ministry</option></select><select id="speakerFilter"><option value="">All speakers</option><option>Dr. Elias Ward</option><option>Rev. Miriam Cole</option></select><select id="yearFilter"><option value="">All years</option><option>2026</option><option>2025</option></select></div><div id="sermonGrid" class="grid grid-2"></div><section class="section"><h2 class="section-title">Downloadable Materials</h2><div class="card"><p><a href="#">Spiritual Formation Handbook (PDF)</a><br><a href="#">Conference Notes (PDF)</a></p></div></section></div></main><div id="site-footer"></div><script src="assets/js/data.js"></script><script src="assets/js/components.js"></script><script src="assets/js/main.js"></script><script>
renderBreadcrumb([{label:'Home',href:'/index.html'},{label:'Sermons & Resources',href:'#'}]);
const sermons = window.SITE_DATA.sermons;
function renderSermons(){
const q=searchSermon.value.toLowerCase();const t=topicFilter.value;const s=speakerFilter.value;const y=yearFilter.value;
const filtered=sermons.filter(x=>(!q||x.title.toLowerCase().includes(q))&&(!t||x.topic===t)&&(!s||x.speaker===s)&&(!y||x.year===y));
sermonGrid.innerHTML=filtered.map(item=>`<article class="card"><h3>${item.title}</h3><p>${item.topic} · ${item.speaker} · ${item.year}</p>${item.type==='video'?`<iframe class='media-player' loading='lazy' src='${item.embed}'></iframe>`:`<audio controls style='width:100%'><source src='${item.src}' type='audio/mpeg'></audio>`}</article>`).join('');
}
[searchSermon,topicFilter,speakerFilter,yearFilter].forEach(el=>el.addEventListener('input',renderSermons));renderSermons();
</script></body></html>
