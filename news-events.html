<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>News & Events</title><link rel="stylesheet" href="assets/css/styles.css"></head><body><div id="site-header"></div><div id="breadcrumb"></div><main class="section"><div class="container"><h1 class="section-title">News & Events</h1><input id="newsSearch" placeholder="Search news/event"><div id="newsGrid" class="grid grid-2" style="margin-top:1rem"></div><section class="section"><h2 class="section-title">Event Calendar</h2><div id="calendarList" class="grid grid-3"></div></section></div></main><div id="site-footer"></div><script src="assets/js/data.js"></script><script src="assets/js/components.js"></script><script src="assets/js/main.js"></script><script>
renderBreadcrumb([{label:'Home',href:'/index.html'},{label:'News & Events',href:'#'}]);
const {news,events}=window.SITE_DATA;
function renderNews(){const q=newsSearch.value.toLowerCase();newsGrid.innerHTML=news.filter(n=>!q||n.title.toLowerCase().includes(q)).map(n=>`<article class='card'><h3>${n.title}</h3><p>${n.date} · ${n.category}</p><a href='/${n.href}' class='btn btn-secondary'>Read detail</a></article>`).join('');}
calendarList.innerHTML=events.map(e=>`<article class='card'><h3>${e.title}</h3><p>${e.date}<br>${e.location}</p></article>`).join('');
newsSearch.addEventListener('input',renderNews);renderNews();
</script></body></html>
